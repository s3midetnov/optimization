[project]
name = "semester-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "s3midetnov", email = "artemsemidetnov@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
]

[project.scripts]
semester-project = "semester_project.main:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
]
